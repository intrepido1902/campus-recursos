<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="contenedor">
    <h1>Categorias</h1>
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <form th:action="@{/categorias}" th:object="${categoria}" method="post" class="formulario">
        <input type="text" th:field="*{nombre}" placeholder="Nombre de la categoria" required>
        <button type="submit">Agregar</button>
    </form>

    <table class="tabla">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.nombre}">Nombre</td>
            <td class="acciones">
                <a th:href="@{/categorias/{id}/editar(id=${c.id})}">Editar</a>
                <form th:action="@{/categorias/{id}/eliminar(id=${c.id})}" method="post" class="form-inline"
                      onsubmit="return confirm('¿Eliminar esta categoria?');">
                    <button type="submit" class="boton-peligro">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
