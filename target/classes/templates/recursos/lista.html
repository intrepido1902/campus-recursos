<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalogo de recursos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="contenedor">
    <h1>Catalogo de recursos</h1>
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <a th:href="@{/recursos/nuevo}" class="boton-principal">+ Nuevo recurso</a>

    <!-- Requisito 4.a.iii: filtros basicos por categoria, ubicacion, tipo y estado -->
    <form th:action="@{/recursos}" method="get" class="filtro">
        <select name="categoriaId">
            <option value="">Todas las categorias</option>
            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                    th:selected="${c.id == categoriaId}"></option>
        </select>
        <select name="ubicacionId">
            <option value="">Todas las ubicaciones</option>
            <option th:each="u : ${ubicaciones}" th:value="${u.id}" th:text="${u.nombre}"
                    th:selected="${u.id == ubicacionId}"></option>
        </select>
        <select name="tipo">
            <option value="">Todos los tipos</option>
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"
                    th:selected="${t == tipoSeleccionado}"></option>
        </select>
        <select name="estado">
            <option value="">Todos los estados</option>
            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"
                    th:selected="${e == estadoSeleccionado}"></option>
        </select>
        <button type="submit">Filtrar</button>
        <a th:href="@{/recursos}">Limpiar</a>
    </form>

    <table class="tabla">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Categoria</th>
            <th>Ubicacion</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${recursos}">
            <td th:text="${r.nombre}">Nombre</td>
            <td th:text="${r.tipo}">Tipo</td>
            <td th:text="${r.categoria != null ? r.categoria.nombre : '-'}">Categoria</td>
            <td th:text="${r.ubicacion != null ? r.ubicacion.nombre : '-'}">Ubicacion</td>
            <td>
                <span class="etiqueta-estado" th:classappend="'estado-' + ${r.estado}" th:text="${r.estado}">Estado</span>
            </td>
            <td class="acciones">
                <a th:href="@{/recursos/{id}/editar(id=${r.id})}">Editar</a>
                <form th:action="@{/recursos/{id}/eliminar(id=${r.id})}" method="post" class="form-inline"
                      onsubmit="return confirm('¿Eliminar este recurso?');">
                    <button type="submit" class="boton-peligro">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
