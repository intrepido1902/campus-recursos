<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva reserva</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="contenedor">
    <h1>Nueva reserva</h1>
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <!-- La validacion de conflictos (RN-01) y de bloqueo (RN-02) se hace en el
         servidor (ReservaService), no aqui. Si falla, el flash "error" se
         muestra arriba al volver a esta misma pagina. -->
    <form th:action="@{/reservas}" method="post" class="formulario formulario-vertical">
        <label>Recurso
            <select name="recursoId" required>
                <option th:each="r : ${recursos}" th:value="${r.id}"
                        th:text="${r.nombre + ' (' + r.estado + ')'}"></option>
            </select>
        </label>
        <label>Solicitante
            <input type="text" name="solicitante" placeholder="Nombre de quien reserva" required>
        </label>
        <label>Fecha y hora de inicio
            <input type="datetime-local" name="fechaInicio" required>
        </label>
        <label>Fecha y hora de fin
            <input type="datetime-local" name="fechaFin" required>
        </label>
        <div class="acciones-formulario">
            <button type="submit">Reservar</button>
            <a th:href="@{/reservas}" class="boton-secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
