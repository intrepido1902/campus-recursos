<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar entrega</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="contenedor">
    <h1>Registrar entrega de equipo</h1>
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <!-- RN-02 y RN-03 se validan en PrestamoService: no se puede prestar un
         recurso bloqueado ni uno que ya este prestado. -->
    <form th:action="@{/prestamos}" method="post" class="formulario formulario-vertical">
        <label>Recurso
            <select name="recursoId" required>
                <option th:each="r : ${recursos}" th:value="${r.id}"
                        th:text="${r.nombre + ' (' + r.estado + ')'}"></option>
            </select>
        </label>
        <label>Responsable
            <input type="text" name="responsable" placeholder="Nombre de quien recibe el equipo" required>
        </label>
        <label>Fecha limite de devolucion
            <input type="datetime-local" name="fechaLimite" required>
        </label>
        <label>Estado inicial del equipo
            <input type="text" name="estadoInicial" placeholder="Ej: Buen estado, sin danos visibles" required>
        </label>
        <div class="acciones-formulario">
            <button type="submit">Registrar entrega</button>
            <a th:href="@{/prestamos}" class="boton-secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
