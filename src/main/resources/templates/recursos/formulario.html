<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${recurso.id == null ? 'Nuevo recurso' : 'Editar recurso'}">Recurso</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="contenedor">
    <h1 th:text="${recurso.id == null ? 'Nuevo recurso' : 'Editar recurso'}">Recurso</h1>

    <!-- Los campos se envian sueltos (no como objeto anidado), igual que en el
         ejercicio de biblioteca visto en clase (autorId, editorialId). -->
    <form th:action="(${recurso.id == null}) ? (@{/recursos}) : (@{/recursos/{id}(id=${recurso.id})})"
          method="post" class="formulario formulario-vertical">

        <label>Nombre
            <input type="text" name="nombre" th:value="${recurso.nombre}" required>
        </label>

        <label>Tipo
            <select name="tipo" required>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"
                        th:selected="${t == recurso.tipo}"></option>
            </select>
        </label>

        <label>Categoria
            <select name="categoriaId" required>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${recurso.categoria != null and c.id == recurso.categoria.id}"></option>
            </select>
        </label>

        <label>Ubicacion
            <select name="ubicacionId" required>
                <option th:each="u : ${ubicaciones}" th:value="${u.id}" th:text="${u.nombre}"
                        th:selected="${recurso.ubicacion != null and u.id == recurso.ubicacion.id}"></option>
            </select>
        </label>

        <label>Descripcion
            <textarea name="descripcion" th:text="${recurso.descripcion}"></textarea>
        </label>

        <label>Caracteristicas principales
            <textarea name="caracteristicas" th:text="${recurso.caracteristicas}"></textarea>
        </label>

        <!-- El estado solo se edita manualmente en un recurso existente. Al crear uno
             nuevo, siempre inicia en DISPONIBLE (ver constructor de Recurso). -->
        <label th:if="${recurso.id != null}">
            Estado
            <select name="estado">
                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"
                        th:selected="${e == recurso.estado}"></option>
            </select>
        </label>

        <div class="acciones-formulario">
            <button type="submit">Guardar</button>
            <a th:href="@{/recursos}" class="boton-secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
