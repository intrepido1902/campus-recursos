<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="contenedor">
    <h1>Reservas</h1>
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <a th:href="@{/reservas/nueva}" class="boton-principal">+ Nueva reserva</a>

    <table class="tabla">
        <thead>
        <tr>
            <th>Recurso</th>
            <th>Solicitante</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservas}">
            <td th:text="${r.recurso.nombre}">Recurso</td>
            <td th:text="${r.solicitante}">Solicitante</td>
            <td th:text="${#temporals.format(r.fechaInicio, 'dd/MM/yyyy HH:mm')}">Inicio</td>
            <td th:text="${#temporals.format(r.fechaFin, 'dd/MM/yyyy HH:mm')}">Fin</td>
            <td>
                <span class="etiqueta-estado" th:classappend="'estado-' + ${r.estado}" th:text="${r.estado}">Estado</span>
            </td>
            <td class="acciones" th:if="${r.estado.name() == 'CONFIRMADA'}">
                <a th:href="@{/reservas/{id}/editar(id=${r.id})}">Modificar</a>
                <form th:action="@{/reservas/{id}/cancelar(id=${r.id})}" method="post" class="form-inline"
                      onsubmit="return confirm('¿Cancelar esta reserva?');">
                    <button type="submit" class="boton-peligro">Cancelar</button>
                </form>
            </td>
            <td th:unless="${r.estado.name() == 'CONFIRMADA'}">-</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
