<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar reserva</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="contenedor">
    <h1>Modificar reserva</h1>
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <!-- Requisito 4.b.iii: consultar y modificar una reserva antes de su inicio. -->
    <form th:action="@{/reservas/{id}(id=${reserva.id})}" method="post" class="formulario formulario-vertical">
        <p><strong>Recurso:</strong> <span th:text="${reserva.recurso.nombre}"></span></p>
        <p><strong>Solicitante:</strong> <span th:text="${reserva.solicitante}"></span></p>

        <label>Fecha y hora de inicio
            <input type="datetime-local" name="fechaInicio"
                   th:value="${#temporals.format(reserva.fechaInicio, 'yyyy-MM-dd''T''HH:mm')}" required>
        </label>
        <label>Fecha y hora de fin
            <input type="datetime-local" name="fechaFin"
                   th:value="${#temporals.format(reserva.fechaFin, 'yyyy-MM-dd''T''HH:mm')}" required>
        </label>
        <div class="acciones-formulario">
            <button type="submit">Guardar cambios</button>
            <a th:href="@{/reservas}" class="boton-secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
