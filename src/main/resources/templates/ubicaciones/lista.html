<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ubicaciones</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="contenedor">
    <h1>Ubicaciones</h1>
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <form th:action="@{/ubicaciones}" th:object="${ubicacion}" method="post" class="formulario">
        <input type="text" th:field="*{nombre}" placeholder="Nombre de la ubicacion" required>
        <input type="text" th:field="*{edificio}" placeholder="Edificio / piso (opcional)">
        <button type="submit">Agregar</button>
    </form>

    <table class="tabla">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Edificio</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${ubicaciones}">
            <td th:text="${u.nombre}">Nombre</td>
            <td th:text="${u.edificio}">Edificio</td>
            <td class="acciones">
                <a th:href="@{/ubicaciones/{id}/editar(id=${u.id})}">Editar</a>
                <form th:action="@{/ubicaciones/{id}/eliminar(id=${u.id})}" method="post" class="form-inline"
                      onsubmit="return confirm('¿Eliminar esta ubicacion?');">
                    <button type="submit" class="boton-peligro">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
