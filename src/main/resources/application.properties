# Base de datos en memoria H2 (suficiente para el prototipo de la entrega 1).
# Los datos se recrean cada vez que se reinicia la aplicacion; el Programa Batch
# (DatosIniciales) se encarga de poblarla de nuevo en cada arranque.
spring.datasource.url=jdbc:h2:mem:campusdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola web de H2, util para revisar las tablas mientras se prueba: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:campusdb, usuario: sa, sin contrasena)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
